services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: accounting-engine-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - accounting-engine-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - accounting-engine-net

  # Cache de reportes (decisión de proyecto previa) + fuente de verdad del camino caliente de
  # Auth (tasks/plan-auth.md). notify-keyspace-events Ex habilita el listener de expiración de
  # sesiones (RedisSessionExpiryListener). Sin puerto expuesto al host: solo "api" lo necesita.
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: accounting-engine-redis
    command: redis-server --notify-keyspace-events Ex
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - accounting-engine-net

  api:
    build:
      context: ./api
      dockerfile: src/Api/Dockerfile
    container_name: accounting-engine-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - accounting-engine-net
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: accounting-engine-nginx
    ports:
      - "${HTTP_PORT}:80"
    depends_on:
      - api
    networks:
      accounting-engine-net:
        # IP fija: Api/Program.cs confía en este subnet vía ForwardedHeadersOptions.KnownNetworks
        # para leer la IP real del cliente (tasks/plan-auth.md) — no en el rango por defecto de Docker.
        ipv4_address: 172.28.0.10

networks:
  accounting-engine-net:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  accounting-engine-pgdata:
