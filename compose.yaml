services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: accounting-engine-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - accounting-engine-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - accounting-engine-net

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: accounting-engine-redis
    command: redis-server --notify-keyspace-events Ex --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - accounting-engine-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - accounting-engine-net

  api:
    build:
      context: ./api
      dockerfile: src/Api/Dockerfile
    container_name: accounting-engine-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=motor_contable_app;Password=${ACCOUNTING_APP_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      PlatformAdmin__Email: ${PLATFORM_ADMIN_EMAIL}
      PlatformAdmin__Password: ${PLATFORM_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - accounting-engine-net
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: accounting-engine-nginx
    ports:
      - "${HTTP_PORT}:80"
    depends_on:
      - api
    networks:
      accounting-engine-net:
        ipv4_address: 172.28.0.10

networks:
  accounting-engine-net:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  accounting-engine-pgdata:
  accounting-engine-redisdata:
