services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: accounting-engine-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - accounting-engine-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: src/Api/Dockerfile
    container_name: accounting-engine-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: accounting-engine-nginx
    ports:
      - "${HTTP_PORT}:80"
    depends_on:
      - api

volumes:
  accounting-engine-pgdata:
